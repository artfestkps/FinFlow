<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="finflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="finflow-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="finflow-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="#0B132B" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#finflow-grad)" stroke-width="6" stroke-opacity="0.4" fill="#0F172A" />

  <!-- Dynamic Financial Pulse Waves -->
  <g filter="url(#glow)">
    <!-- Infinity / Flow Loop -->
    <path d="M140 310 C 140 230, 210 210, 256 256 C 302 302, 372 282, 372 202 C 372 122, 302 142, 256 188 C 210 234, 140 214, 140 144" 
          stroke="url(#finflow-secondary)" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.85" />
          
    <path d="M130 320 C 180 320, 220 280, 256 230 C 292 180, 332 140, 390 140" 
          stroke="url(#finflow-accent)" stroke-width="32" stroke-linecap="round" fill="none" />
          
    <!-- Upward Growth Arrow -->
    <path d="M320 140 L 390 140 L 390 210" 
          stroke="url(#finflow-accent)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central Liquid Token / Diamond -->
  <circle cx="256" cy="230" r="28" fill="#10B981" />
  <circle cx="256" cy="230" r="14" fill="#ECFDF5" />

  <!-- Bottom Balance Bar Nodes -->
  <rect x="156" y="380" width="70" height="18" rx="9" fill="#10B981" />
  <rect x="236" y="380" width="120" height="18" rx="9" fill="#6366F1" />
</svg>
